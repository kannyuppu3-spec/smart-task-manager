<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

    body {

        background: #f4f6f9;
    }

    .card {

        border-radius: 15px;
    }

    .card:hover {

        transform: scale(1.01);

        transition: 0.3s;
    }

    h2 {

        font-weight: bold;
    }

</style>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow"></nav>

        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">
                Smart Task Manager
            </span>

        </div>

    </nav>

    <div class="container mt-4">

        <div class="row">

            <!-- Add Task Form -->

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h3>Add Task</h3>

                        <form id="taskForm">

                            <input
                                type="text"
                                id="title"
                                class="form-control mb-3"
                                placeholder="Task Title"
                                required
                            >

                            <textarea
                                id="description"
                                class="form-control mb-3"
                                placeholder="Description"
                            ></textarea>

                            <select
                                id="priority"
                                class="form-control mb-3"
                            >

                                <option>High</option>

                                <option>Medium</option>

                                <option>Low</option>

                            </select>

                            <select
                                id="status"
                                class="form-control mb-3"
                            >

                                <option>Pending</option>

                                <option>Completed</option>

                            </select>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Add Task
                            </button>

                        </form>

                    </div>

                </div>

            </div>

            <!-- Analytics -->

            <div class="col-md-8">

                <div class="row">

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h5>Total</h5>

                                <h2 id="totalTasks">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h5>Completed</h5>

                                <h2 id="completedTasks">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h5>Pending</h5>

                                <h2 id="pendingTasks">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h5>Completion %</h5>

                                <h2 id="completionPercentage">0%</h2>

                            </div>

                        </div>

                    </div>

                </div>
                <!-- Task List -->

<div class="card shadow mt-4">

    <div class="card-body">

        <h3>Task List</h3>

        <table class="table table-bordered">

            <thead>

                <tr>

                    <th>Title</th>

                    <th>Priority</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="taskTable">

            </tbody>

        </table>

    </div>

</div>

                <!-- Notification -->

                <div class="alert alert-success mt-4 d-none"
                    id="notification">

                </div>

            </div>

        </div>

    </div>

    <script>

        const socket = io();

        socket.on('new_task', function(data) {

            const notification =
                document.getElementById('notification');

            notification.classList.remove('d-none');

            notification.innerHTML = data.message;

            loadAnalytics();
            loadTasks();
            async function loadTasks() {

    const response =
        await fetch('/api/tasks');

    const tasks = await response.json();

    const taskTable =
        document.getElementById('taskTable');

    taskTable.innerHTML = '';

    tasks.forEach(task => {

      taskTable.innerHTML += `

<tr>

    <td>${task.title}</td>

    <td>

        <span class="
            badge
            ${task.priority === 'High'
                ? 'bg-danger'
                : task.priority === 'Medium'
                ? 'bg-warning text-dark'
                : 'bg-success'}
        ">

            ${task.priority}

        </span>

    </td>

    <td>

        <span class="
            badge
            ${task.status === 'Completed'
                ? 'bg-success'
                : 'bg-secondary'}
        ">

            ${task.status}

        </span>

    </td>

</tr>
`; 
    });
}

loadTasks();
        });

        document.getElementById('taskForm')
            .addEventListener('submit', async function(e) {

            e.preventDefault();

            const taskData = {

                title:
                    document.getElementById('title').value,

                description:
                    document.getElementById('description').value,

                priority:
                    document.getElementById('priority').value,

                status:
                    document.getElementById('status').value
            };

            await fetch('/api/tasks', {

                method: 'POST',

                headers: {

                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(taskData)
            });

            document.getElementById('taskForm').reset();

            loadAnalytics();
            loadTasks();
        });

        async function loadAnalytics() {

            const response =
                await fetch('/api/analytics');

            const data = await response.json();

            document.getElementById('totalTasks')
                .innerHTML = data.total_tasks;

            document.getElementById('completedTasks')
                .innerHTML = data.completed_tasks;

            document.getElementById('pendingTasks')
                .innerHTML = data.pending_tasks;

            document.getElementById('completionPercentage')
                .innerHTML =
                    data.completion_percentage + "%";
        }

        loadAnalytics();

    </script>
<footer class="text-center mt-5 mb-3">

    <p>
        Smart Task Manager © 2026
    </p>

</footer>
</body>

</html>
